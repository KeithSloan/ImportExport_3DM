<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ImportExport 3DM</title>

  <!-- Background rounded rectangle -->
  <rect x="1" y="1" width="62" height="62" rx="9" ry="9" fill="#1c4f8a"/>

  <!-- NURBS control mesh — 3x3 grid of wavy iso-curves -->
  <!-- Horizontal U-curves (wavy to suggest curvature) -->
  <path d="M 9 15 Q 19 10, 32 15 Q 45 20, 55 15"
        fill="none" stroke="#6ab4e8" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 9 23 Q 19 18, 32 23 Q 45 28, 55 23"
        fill="none" stroke="#6ab4e8" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 9 31 Q 19 26, 32 31 Q 45 36, 55 31"
        fill="none" stroke="#6ab4e8" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Vertical V-lines connecting the curves -->
  <line x1="9"  y1="15" x2="9"  y2="31" stroke="#6ab4e8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="32" y1="15" x2="32" y2="31" stroke="#6ab4e8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="55" y1="15" x2="55" y2="31" stroke="#6ab4e8" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Control-point dots at mesh intersections -->
  <circle cx="9"  cy="15" r="2.2" fill="#c8e8fa"/>
  <circle cx="32" cy="15" r="2.2" fill="#c8e8fa"/>
  <circle cx="55" cy="15" r="2.2" fill="#c8e8fa"/>
  <circle cx="9"  cy="23" r="2.2" fill="#c8e8fa"/>
  <circle cx="32" cy="23" r="2.2" fill="#c8e8fa"/>
  <circle cx="55" cy="23" r="2.2" fill="#c8e8fa"/>
  <circle cx="9"  cy="31" r="2.2" fill="#c8e8fa"/>
  <circle cx="32" cy="31" r="2.2" fill="#c8e8fa"/>
  <circle cx="55" cy="31" r="2.2" fill="#c8e8fa"/>

  <!-- Divider line -->
  <line x1="8" y1="39" x2="56" y2="39" stroke="#3a7dbf" stroke-width="0.8"/>

  <!-- Import arrow: points right, left side (data flowing INTO FreeCAD) -->
  <line x1="5" y1="51" x2="15" y2="51"
        stroke="#51c26f" stroke-width="2.4" stroke-linecap="round"/>
  <polyline points="12,47 17,51 12,55"
            fill="none" stroke="#51c26f" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "3DM" label centred between the arrows -->
  <text x="32" y="56"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="bold"
        fill="white" text-anchor="middle">3DM</text>

  <!-- Export arrow: points left, right side (data flowing OUT of FreeCAD) -->
  <line x1="49" y1="51" x2="59" y2="51"
        stroke="#f5a623" stroke-width="2.4" stroke-linecap="round"/>
  <polyline points="52,47 47,51 52,55"
            fill="none" stroke="#f5a623" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
